name: Pages

# Publishes the landing page at this repository's address,
# https://vivi7.github.io/switchboard-evolution/.
#
# The page has a repository of its own, vivi7/switchboard-evolution-site:
# this workflow checks out its main branch and runs its scripts/build.sh,
# which writes releases.json (the copy of the releases the page falls back
# on when GitHub's API does not answer) and puts the page together in _site.
# The page reads the releases of this repository live, so a published
# release shows at once; the runs below keep the fallback fresh.
#
# - once a day;
# - when a release is published (the github-pages environment allows the
#   v* tags as well as master, for this);
# - by hand, after a change to the page: gh workflow run pages.yml
#
# One-time setup: Settings > Pages > Build and deployment > Source: GitHub
# Actions.

on:
  schedule:
    - cron: "17 5 * * *"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: vivi7/switchboard-evolution-site
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Put the page together
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASES_REPO: ${{ github.repository }}
        run: sh scripts/build.sh

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
