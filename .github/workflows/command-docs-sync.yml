name: Command docs sync

# Once a week, read the CLIs' documentation again and update the command
# catalog's snapshot (apps/desktop/public/command-catalog.generated.json) with
# apps/desktop/scripts/build-command-catalog.mjs.
# - The docs changed: the new snapshot is pushed to the `command-docs-sync`
#   branch and a pull request to master is opened (or updated). Nothing lands
#   on master by itself.
# - The docs no longer read as expected (a page moved, a table changed): an
#   issue says what is wrong, and the snapshot stays as it is.
# The build script and the tests it runs here have no dependencies; Codex is
# installed for its own output (see the step). Pull requests opened with the
# workflow token start no other workflow, so the tests run in this job.
# Needs "Allow GitHub Actions to create and approve pull requests" in the
# repository's Actions settings.

on:
  schedule:
    - cron: "41 6 * * 2"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: command-docs-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SYNC_BRANCH: command-docs-sync
      LABEL: command-docs
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Codex's subcommands and flags come from `codex completion fish`, and
      # its slash commands from its source at the tag of this version.
      - name: Install the CLIs the snapshot reads
        run: npm install --global @openai/codex@latest

      - name: Build the snapshot
        id: build
        run: |
          set +e
          node scripts/build-command-catalog.mjs > build.log 2>&1
          code=$?
          set -e
          cat build.log
          if [ "$code" != 0 ]; then echo "status=broken" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --quiet -- public/command-catalog.generated.json; then
            echo "status=unchanged" >> "$GITHUB_OUTPUT"
          else
            echo "status=changed" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        if: steps.build.outputs.status == 'changed'
        run: node --test test/command-docs-*.test.js test/command-catalog-snapshot.test.js

      - name: Label
        if: steps.build.outputs.status != 'unchanged'
        run: gh label create "$LABEL" --color 5319E7 --description "The command catalog's snapshot of the CLIs' docs" --force

      - name: Open or update the pull request
        if: steps.build.outputs.status == 'changed'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$SYNC_BRANCH"
          git commit -am "Update the command catalog from the CLIs' docs"
          git push --force origin "HEAD:refs/heads/$SYNC_BRANCH"
          title="Update the command catalog from the CLIs' docs"
          {
            echo "The CLIs' documentation changed: \`apps/desktop/public/command-catalog.generated.json\` is built again from it."
            echo
            echo '```'
            cat build.log
            echo '```'
            echo
            echo "Look at the diff of the entries before merging: a command that disappeared may only have moved in the docs."
          } > body.md
          number="$(gh pr list --head "$SYNC_BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh pr edit "$number" --title "$title" --body-file body.md
          else
            gh pr create --head "$SYNC_BRANCH" --base "${{ github.ref_name }}" \
              --title "$title" --body-file body.md --label "$LABEL"
          fi

      - name: Open or update the issue
        if: steps.build.outputs.status == 'broken'
        run: |
          title="The CLIs' docs no longer read as the command catalog expects"
          {
            echo "\`apps/desktop/scripts/build-command-catalog.mjs\` could not build the snapshot. The app keeps the one it has."
            echo
            echo '```'
            cat build.log
            echo '```'
            echo
            echo "Fix the parser in \`apps/desktop/harnesses/commands/\`, then run \`npm run build-command-catalog\` in \`apps/desktop\`."
          } > body.md
          number="$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh issue edit "$number" --title "$title" --body-file body.md
          else
            gh issue create --title "$title" --body-file body.md --label "$LABEL"
          fi
