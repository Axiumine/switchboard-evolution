<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- The app's dark surface, with the accent light behind the mark. -->
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#23233a"/>
      <stop offset="1" stop-color="#0d0d14"/>
    </linearGradient>
    <radialGradient id="light" cx="0.5" cy="0.5" r="0.42">
      <stop offset="0" stop-color="#8088ff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#8088ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#base)"/>
  <rect width="1024" height="1024" fill="url(#light)"/>
</svg>
