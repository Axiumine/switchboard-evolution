    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a2a52"/><stop offset="1" stop-color="#0c0c16"/></linearGradient>
    <radialGradient id="lt" cx="0.5" cy="0.45" r="0.55"><stop offset="0" stop-color="#7c84ff" stop-opacity="0.30"/><stop offset="1" stop-color="#7c84ff" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#lt)"/>
</svg>
