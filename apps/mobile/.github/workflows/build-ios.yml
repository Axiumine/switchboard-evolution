name: Build iOS

# An unsigned iOS IPA, built here on a macOS runner. Reusable: build-mobile.yml
# calls it for a tag; it also runs on its own from the Actions tab.
#
# Unsigned because a free Apple ID cannot sign for distribution, and EAS needs
# a paid Apple Developer account for an iOS build that installs on a phone.
# Sideloadly or AltStore sign the IPA with your own Apple ID when they install
# it; with a free Apple ID it runs for 7 days, then install it again. With a
# paid account, an EAS workflow like build-android.yml can replace this one.
#
# The native project is generated here (npx expo prebuild) and never
# committed: app.json and its config plugins are the source of truth.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    name: unsigned ipa
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Xcode
        run: xcodebuild -version

      - run: npm ci

      - name: Pin app version to the tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: bash scripts/ci-set-app-version.sh "$TAG"

      # Generates ios/ from app.json and installs the pods. It asks nothing:
      # Actions sets CI.
      - run: npx expo prebuild --platform ios

      - name: Archive without signing
        run: |
          set -o pipefail
          workspace=$(ls -d ios/*.xcworkspace | head -1)
          scheme=$(basename "$workspace" .xcworkspace)
          xcodebuild archive \
            -workspace "$workspace" -scheme "$scheme" -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/app.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee "$RUNNER_TEMP/xcodebuild.log" | grep -E '^(\*\*|error:|.*: error:)' || true
          test -d "$RUNNER_TEMP/app.xcarchive/Products/Applications" || { tail -n 80 "$RUNNER_TEMP/xcodebuild.log"; exit 1; }

      - name: Package the IPA
        run: |
          version=$(node -p 'require("./app.json").expo.version')
          mkdir -p "$RUNNER_TEMP/ipa/Payload" out
          cp -R "$RUNNER_TEMP"/app.xcarchive/Products/Applications/*.app "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/out/Switchboard-Evolution-${version}.ipa" Payload)
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: out/*.ipa
          if-no-files-found: error

      - name: Keep the build log when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
